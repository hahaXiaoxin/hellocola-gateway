services:
  gateway:
    build: .
    image: hellocola-gateway
    container_name: hellocola-gateway
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - DEFAULT_TTL=30
      - REAPER_INTERVAL_MS=10000
      - PENDING_CONFIRM_TIMEOUT=60
    networks:
      - hellocola-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: hellocola-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - gateway
    networks:
      - hellocola-net

volumes:
  gateway-data:
    driver: local
  gateway-logs:
    driver: local

networks:
  hellocola-net:
    external: true
